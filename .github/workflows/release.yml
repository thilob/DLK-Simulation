name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.1
  GODOT_STATUS: stable

jobs:
  export:
    name: Export Linux and Windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        shell: bash
        run: |
          set -euo pipefail
          release="${GODOT_VERSION}-${GODOT_STATUS}"
          base_url="https://github.com/godotengine/godot/releases/download/${release}"
          curl --fail --location --retry 3 \
            "${base_url}/Godot_v${release}_linux.x86_64.zip" \
            --output /tmp/godot.zip
          curl --fail --location --retry 3 \
            "${base_url}/Godot_v${release}_export_templates.tpz" \
            --output /tmp/templates.tpz
          mkdir -p /tmp/godot /tmp/templates
          unzip -q /tmp/godot.zip -d /tmp/godot
          unzip -q /tmp/templates.tpz -d /tmp/templates
          chmod +x "/tmp/godot/Godot_v${release}_linux.x86_64"
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          cp -R /tmp/templates/templates/. \
            "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
          echo "/tmp/godot" >> "${GITHUB_PATH}"

      - name: Validate project
        shell: bash
        run: |
          "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path . --editor --quit

      - name: Export release packages
        shell: bash
        run: |
          set -euo pipefail
          godot="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          mkdir -p build/linux build/windows dist
          "${godot}" --headless --path . --export-release Linux \
            build/linux/DLK-Simulation.x86_64
          "${godot}" --headless --path . --export-release Windows \
            build/windows/DLK-Simulation.exe
          chmod +x build/linux/DLK-Simulation.x86_64
          (cd build/linux && zip -9 ../../dist/DLK-Simulation-Linux-x86_64.zip ./*)
          (cd build/windows && zip -9 ../../dist/DLK-Simulation-Windows-x86_64.zip ./*)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DLK-Simulation-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "DLK Simulation ${GITHUB_REF_NAME}" \
            --generate-notes
